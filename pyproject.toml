[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fci-msv"
version = "0.1.0"
description = "Deterministic scenario and unit-economics models behind the FCI MSP-vs-MSV research reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["fci_msv"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["graphify-out", "notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"fci_msv/holding.py" = ["E241"]
"fci_msv/consolidated_savings.py" = ["E241", "E231"]

[tool.pytest.ini_options]
testpaths = ["tests"]
